name = "mapper"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# Custom domain routes
routes = [
  { pattern = "list-mapper.com", custom_domain = true },
  { pattern = "www.list-mapper.com", custom_domain = true }
]

# Serve static files from public directory
[assets]
directory = "./public"

[vars]
ENVIRONMENT = "production"

# D1 Database binding for production
[[d1_databases]]
binding = "DB"
database_name = "mapper_db"
database_id = "f0324c27-590d-40fa-adbf-ca4704e99b33"

# KV namespace for sessions (optional - currently using D1 for sessions)
[[kv_namespaces]]
binding = "SESSIONS_MAPPER"
id = "b6312c0de1a847fea67a47d2242390cd"
