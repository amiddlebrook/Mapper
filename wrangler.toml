name = "mapper"
compatibility_date = "2024-01-01"
main = "src/worker.js"

[vars]
ENVIRONMENT = "production"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "mapper_db"
database_id = "preview-database-id"

# KV for sessions (optional, can use D1 for sessions too)
[[kv_namespaces]]
binding = "SESSIONS"
id = "preview-kv-id"

[build]
command = ""

[[pages]]
project_name = "mapper"
