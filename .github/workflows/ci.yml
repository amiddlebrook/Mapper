name: Validate and deploy Mapper
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check
      - name: Run application tests
        run: npm test
      - name: Verify Workers configuration
        run: npx wrangler deploy --dry-run
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets"; exit 1; }
      - run: npm install --no-audit --no-fund
      - name: Safely apply additive database schema
        run: npm run db:remote
      - name: Publish Worker and static assets
        run: npm run deploy
      - name: Configure Mapper-only public Access bypass
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"] + "/access/apps"
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          domain = "mapper.averymiddlebrook2014.workers.dev"
          def call(url, method="GET", payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError("Cloudflare Access API HTTP " + str(error.code) + ": " + error.read().decode()[:1200])
              if not result.get("success"):
                  raise RuntimeError("Cloudflare Access API failure: " + str(result.get("errors", [])))
              return result.get("result", [])
          matches = [app for app in call(base) if app.get("domain") == domain and app.get("type") == "self_hosted"]
          if len(matches) != 1:
              raise RuntimeError("Expected exactly one Mapper Access app, found " + str(len(matches)) + "; refusing to change others")
          app = matches[0]
          path = base + "/" + app["id"] + "/policies"
          policies = call(path)
          if any(p.get("decision") == "bypass" and any("everyone" in rule for rule in p.get("include", [])) for p in policies):
              print("Existing public bypass is present for Mapper")
          else:
              result = call(path, "POST", {"name": "Mapper public website", "decision": "bypass", "include": [{"everyone": {}}]})
              print("Created Mapper-only public bypass policy:", result.get("id"))
          PY
      - name: Smoke test production app
        run: |
          set -euo pipefail
          URL="https://mapper.averymiddlebrook2014.workers.dev"
          for attempt in $(seq 1 4); do
            response=$(curl -sSL --max-time 15 -w '\nHTTP_STATUS=%{http_code}' "$URL/api/health" 2>&1) || true
            if printf '%s' "$response" | grep -q '"status":"ok"'; then
              echo "Production API health passed"
              break
            fi
            echo "Attempt $attempt: $(printf '%s' "$response" | head -c 500)"
            if [ "$attempt" -eq 4 ]; then
              echo "Production API health check failed; diagnosing DNS and HTTP headers"
              getent hosts mapper.averymiddlebrook2014.workers.dev || true
              curl -sSIL --max-time 15 "$URL/api/health" || true
              exit 1
            fi
            sleep 2
          done
          curl -fLsS --max-time 15 "$URL/" | grep -q '<title>Mapper'
          curl -fLsS --max-time 15 "$URL/app.js" | grep -q 'loadWorkspace'
          curl -fLsS --max-time 15 "$URL/styles.css" | grep -q '.workspace'
          echo "Production API, HTML, JavaScript, and CSS verified"
