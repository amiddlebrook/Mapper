name: Validate and deploy Mapper
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check
      - name: Run application tests
        run: npm test
      - name: Verify Workers configuration
        run: npx wrangler deploy --dry-run
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets"; exit 1; }
      - run: npm install --no-audit --no-fund
      - name: Safely apply additive database schema
        run: npm run db:remote
      - name: Publish Worker and static assets
        run: npm run deploy
      - name: Smoke test production app
        run: |
          set -euo pipefail
          URL="https://mapper.averymiddlebrook2014.workers.dev"
          for attempt in $(seq 1 10); do
            if curl -fLsS --max-time 15 "$URL/api/health" | grep -q '"status":"ok"'; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Production API health check failed"
              exit 1
            fi
            sleep 3
          done
          curl -fLsS --max-time 15 "$URL/" | grep -q '<title>Mapper'
          curl -fLsS --max-time 15 "$URL/app.js" | grep -q 'loadWorkspace'
          curl -fLsS --max-time 15 "$URL/styles.css" | grep -q '.workspace'
          echo "Production API, HTML, JavaScript, and CSS verified"
