name: Validate and deploy Mapper
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check
      - name: Run application tests
        run: npm test
      - name: Verify Workers configuration
        run: npx wrangler deploy --dry-run
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets"; exit 1; }
      - run: npm install --no-audit --no-fund
      - name: Safely apply additive database schema
        run: npm run db:remote
      - name: Publish Worker and static assets
        run: npm run deploy
      - name: Inspect access rules for Mapper
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          url = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"] + "/access/apps"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
          try:
              with urllib.request.urlopen(request, timeout=20) as resp:
                  data = json.load(resp)
                  print("ACCESS_API_STATUS:", resp.status, "SUCCESS:", data.get("success"))
                  for app in data.get("result", []):
                      print("ACCESS_APP:", json.dumps({k: app.get(k) for k in ("id", "name", "type", "domain", "destinations")}))
          except urllib.error.HTTPError as error:
              print("ACCESS_API_STATUS:", error.code, error.read().decode()[:1400])
          except Exception as error:
              print("ACCESS_API_ERROR:", str(error))
          PY
      - name: Smoke test production app
        run: |
          set -euo pipefail
          URL="https://mapper.averymiddlebrook2014.workers.dev"
          for attempt in $(seq 1 4); do
            response=$(curl -sSL --max-time 15 -w '\nHTTP_STATUS=%{http_code}' "$URL/api/health" 2>&1) || true
            if printf '%s' "$response" | grep -q '"status":"ok"'; then
              echo "Production API health passed"
              break
            fi
            echo "Attempt $attempt: $(printf '%s' "$response" | head -c 500)"
            if [ "$attempt" -eq 4 ]; then
              echo "Production API health check failed; diagnosing DNS and HTTP headers"
              getent hosts mapper.averymiddlebrook2014.workers.dev || true
              curl -sSIL --max-time 15 "$URL/api/health" || true
              exit 1
            fi
            sleep 2
          done
          curl -fLsS --max-time 15 "$URL/" | grep -q '<title>Mapper'
          curl -fLsS --max-time 15 "$URL/app.js" | grep -q 'loadWorkspace'
          curl -fLsS --max-time 15 "$URL/styles.css" | grep -q '.workspace'
          echo "Production API, HTML, JavaScript, and CSS verified"
