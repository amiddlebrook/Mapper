name = "mapper"
compatibility_date = "2024-01-01"
main = "src/worker.js"

[vars]
ENVIRONMENT = "production"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "mapper_db"
database_id = "preview-database-id"

# KV for sessions (optional - currently using D1 for sessions)
[[kv_namespaces]]
binding = "SESSIONS_MAPPER"
id = "b6312c0de1a847fea67a47d2242390cd"

[build]
command = ""

[[pages]]
project_name = "mapper"
